# SPDX-License-Identifier: Apache-2.0
# Lumen OS installer: the projectors it knows. What a projector IS lives here; what the installer DOES
# (its steps, and the only partitions it may write) stays in lumen-install.sh and lumen-install.ps1, so
# this file can never widen what is written. Data only: both scripts parse it strictly and never run it.
# Lines: id.KEY=value (id: a-z 0-9; KEY: A-Z 0-9 _). A value holds only letters, digits, spaces and . _ : / -
# Keys: NAME (shown to the user), MODEL (ro.boot.xgimi.modelname), BOARD (ro.boot.hardware), FB_PRODUCT
# (fastbootd 'product'), VENDOR_OK (XGIMI firmware versions, ro.vendor.build.version.incremental; the first
# one is the recommended one), CERT (checks SHA256SUMS.sig), IMAGE_TOKEN (part of the image file name),
# IMAGE_FS, VERSION_PROP, LUMEN_PROP (a property and its value on a running Lumen OS for this projector),
# LOGICAL (the logical partitions of super), SUPER_RESERVE (bytes of super kept free for its metadata),
# GUIDE (its section of docs/install/<language>.md), RESTORE_BIN and RESTORE_MD5 (md5:version of XGIMI's
# known stock firmware files, checked by 'stick').
# The z9x lines repeat the constants of the scripts (the Z9X does not read this file; the mock test
# tools/ota/test/installer_profiles.sh checks that both agree).
z9x.NAME=XGIMI Z9X
z9x.MODEL=G0082
z9x.BOARD=mt9952
z9x.FB_PRODUCT=mt5877
z9x.VENDOR_OK=v6.15.58 v6.15.19
z9x.CERT=certs/ota.x509.pem
z9x.VERSION_PROP=ro.z9x.version
play6.NAME=XGIMI Play 6
play6.MODEL=G0058
play6.BOARD=mt5889
play6.FB_PRODUCT=mt5889
play6.VENDOR_OK=v1.7.116
play6.CERT=certs/play6/ota.x509.pem
play6.IMAGE_TOKEN=play6
play6.IMAGE_FS=ext4
play6.VERSION_PROP=ro.lumen.version
play6.LUMEN_PROP=ro.lumen.device play6
play6.LOGICAL=system vendor
play6.SUPER_RESERVE=4194304
play6.GUIDE=play6
play6.RESTORE_BIN=XGIMI_DRAGONHEALTHY_XN03C.bin
play6.RESTORE_MD5=55ae66ed7e14a20759ea4b9d5686d591:V1.7.116
