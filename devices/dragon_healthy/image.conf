# Lumen OS image recipe: XGIMI Play 6. Data only, read by tools/devices/devices.py (keys in its header).
# Not generic this round: tools/play6/build_test.sh stages its own inputs (its IN array) and runs
# tools/play6/compose.sh on the build host named in ~/.config/lumen/builder.env.
generic=no
entry=tools/play6/build_test.sh
compose=tools/play6/compose.sh
host=builder.env
remote_dir=play6-work
stage=none
variants=
fs=ext4
