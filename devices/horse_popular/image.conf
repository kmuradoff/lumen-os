# Lumen OS image recipe: XGIMI Z9X. Data only, read by tools/devices/devices.py (keys in its header).
# Not generic: tools/lumen_v1.sh builds the image from the prebuilt system tar on the build host named in
# ~/.config/lumen/builder.env, and stages its own inputs.
generic=no
entry=tools/lumen_v1.sh
compose=none
host=builder.env
remote_dir=z9x/out
stage=none
variants=
fs=erofs
