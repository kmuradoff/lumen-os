# Lumen OS image recipe: XGIMI Z9X HB. Data only, read by tools/devices/devices.py (keys in its header) and
# tools/image/compose.sh. The composer runs on the build host; only these files are staged (no key, no APK), plus
# stage_dir: the signed outputs of tools/devices/sign_device.py goat_elegant (APKs, APEXes, mac_permissions; no key).
# variants: adb, stick and diag are the test builds of a tN VARIANT; release with a tN VARIANT is the secured test
# image, with a version VARIANT (x.y.z[-mark]) the public release.
# otatest: the OTA test image of a version VARIANT (the release image reading update-hb-test.json on the tag hb).
# Since 1.0.8 the public image carries the OTA client: the gate files of
# tools/devices/ota/image, the HB gate data and props, otacerts.zip (make_otacerts.py), the bootctl pin (the binary
# itself is ~/<remote_dir>/in/bootctl on the host, put there by image/build_bootctl.sh) and the updater's default
# permissions file.
generic=yes
entry=tools/image/compose.sh
compose=devices/goat_elegant/image/compose_hb.sh
host=xgimi-builder
remote_dir=hb-out
stage=devices/goat_elegant/image/compose_hb.sh devices/goat_elegant/image/verify_tree.py devices/goat_elegant/image/hb_prop.txt devices/goat_elegant/image/hb_compat.rc devices/goat_elegant/image/hb_netadb.rc devices/goat_elegant/image/base.sha256 overlay/debug/z9x_earlylog.rc overlay/debug/z9x_earlylog.sh overlay/debug/lumen_escape.rc overlay/debug/lumen_escape.sh devices/goat_elegant/image/hb_lumen_prop.txt devices/goat_elegant/image/privapp-permissions-hbprojector.xml devices/goat_elegant/image/hb_audio.rc devices/goat_elegant/image/hb_audio_policy_engine_stream_volumes.xml devices/goat_elegant/image/hb_audio_policy_configuration.xml devices/goat_elegant/image/hb_audio_policy_check.py devices/goat_elegant/image/hb_vendor_services.rc devices/goat_elegant/image/hb_media.rc devices/goat_elegant/image/privapp-permissions-lumeninfo.xml overlay/v1/z9x_nui.rc overlay/v1/z9x_nui.sh overlay/v1/bootanimation.zip overlay/v1/privapp-permissions-z9xhome.xml overlay/v1/privapp-permissions-z9xsetup.xml overlay/v1/z9x-home-default-permissions.xml overlay/v1/z9x-sysconfig-nogms.xml overlay/v1/keylayout/Vendor_000d_Product_3841.kl overlay/v1/keylayout/Vendor_3697_Product_0001.kl overlay/v1/keylayout/Vendor_3697_Product_0002.kl overlay/v1/idc/Vendor_000d_Product_3841.idc tools/play6/check_privapp.py tools/lumen/apkinfo.py tools/ota/image/z9x_gapps.rc tools/ota/image/z9x_gapps.sh tools/ota/image/z9x-gapps-sysconfig.xml devices/goat_elegant/image/gapps_allow.txt tools/ota/image/z9x_blobs.rc tools/ota/image/z9x_blobs.sh devices/goat_elegant/image/blobs_allow.txt tools/devices/ota/image/lumen_ota.sh tools/devices/ota/image/lumen_ota.rc tools/devices/ota/image/lumen_update_verifier.rc tools/devices/ota/image/lumen_ota_escape.sh devices/goat_elegant/image/ota_gate.conf devices/goat_elegant/image/hb_ota_props.txt devices/goat_elegant/image/otacerts.zip devices/goat_elegant/image/bootctl.sha256 tools/ota/image/z9x-updater-default-permissions.xml
variants=adb:--usb-adb stick: diag:--diag release:--release otatest:--release,--ota-test
fs=erofs
stage_dir=build/goat_elegant/signed_stage
