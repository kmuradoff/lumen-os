# Lumen OS device registry: XGIMI Z9X HB (ro.product.device). Data only, never sourced: tools/devices/devices.py
# reads it (format and keys in its header). One key=value per line; a list is space-separated.
codename=goat_elegant
name=XGIMI Z9X HB
models=G0130
platform=mt5873
hardware=mt9660
abi=arm32
base_product=lineage_gsi_tv_arm
vendor_sdk=33
vendor_firmware=v6.16.24
hal_transport=aidl
image_fs=erofs
slots=ab-virtual
install_flow=ab-fastbootd
ota_engine=update_engine
ota_wire_id=hb
prop_namespace=ro.lumen
keys_dir=~/.lumen-keys/goat_elegant
app_prefix=Hb
# 2026-11-04 OTA: update_engine with the device-neutral tools of
#   tools/devices/ota (devices/goat_elegant/ota.conf); hb-nogms is the public channel, hb-test the staging one
#   (ota.conf stage_channel); manifests on the fixed pre-release tag hb, never releases/latest
channel=hb-nogms hb-test
ota_tools=tools/devices/ota
installer_id=hb
fastboot_product=mt5873
forks=devices/goat_elegant/forks.tsv
hal_check=aidl-table
hal_app=apps/HbProjector
hal_codes=devices/goat_elegant/research/aidl_codes.tsv
hal_banned=devices/goat_elegant/research/banned.tsv
hal_allowed=devices/goat_elegant/research/allowed.tsv
# t3: BtPair is apps/Z9xBtPair built from its sources (org.lumen.btpair) with this device's key; nothing in that folder changes
# t5: HbFrameworkOverlay (org.lumen.overlay.hb), the framework key RRO: remote keys to org.lumen.projector / org.lumen.tvinput
# t11: LumenInfo (org.lumen.info, apps/LumenInfo): signal info screen and overlay, priv-app, sharedUserId system;
#      its HAL calls are checked by its own host test (apps/LumenInfo/test, Hb.PLAN against research/allowed.tsv
#      plus research/allowed_lumeninfo.tsv, the maintainer's extra read-only getters of 2026-11-01)
# 2026-11-04 OTA: LumenUpdater (org.lumen.updater, the shared recipe devices/goat_elegant/app/LumenUpdater.layers),
#   /system/app/LumenUpdater, the HB platform key
apps=HbProjector Z9xBtPair HbFrameworkOverlay LumenInfo LumenUpdater
