# Lumen OS OTA boot gate data for the Z9X HB (image path /system/etc/lumen/ota_gate.conf, 0644), read strictly by
# tools/devices/ota/image/lumen_ota.sh (every mode except count and verifier; a missing or invalid file = no
# rollback, lumen_escape decides). docs/architecture/OTA_CLIENT.md section 3.
#   hal              the HIDL boot@1.2 HAL through the pinned 32-bit AOSP bootctl (image.conf, BOOTCTL.md)
#   health           init services that must run before the gate marks the slot; xgimi_middle is the vendor
#                    gmpf service (lamp, fans), as gmpf_main is on the Z9X
#   ns               property namespace (ro.lumen.ota.gate, ro.lumen.build_id, ro.lumen.ota.test_fail)
#   max_attempts     boot attempts of an update slot before the rollback
#   deadline         s after post-fs-data: no boot_completed -> rollback
#   health_delay     s after boot_completed before the health checks
#   start_count_max  system_server starts before boot_completed -> rollback (lumen_escape acts at 8)
hal=bootctl
health=zygote surfaceflinger xgimi_middle
lamp=xgimi_middle
ns=ro.lumen
max_attempts=3
deadline=480
health_delay=90
start_count_max=4
