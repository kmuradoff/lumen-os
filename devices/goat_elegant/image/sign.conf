# What tools/devices/sign_device.py signs for the Z9X HB (goat_elegant). Data only, key=value, '#' comments.
# Paths without a leading / are relative to gsi/ on the Mac; *_remote paths are relative to the build host's home
# (host and remote_dir of image.conf). No key is named here: the platform key is keys_dir/platform.pk8 of
# device.conf, and the four APEXes keep the base build's own AOSP module test keys (sign_device.py header).
#
# the base the image is composed on (compose_hb.sh step 0) and its pin
base_image_remote=lumen-builder-backup/play6-out/target/product/generic/system.img
base_sha256=devices/goat_elegant/image/base.sha256
# the Mac copy of that base's APKs, APEXes and text files (sign_device.py base-import)
base_dir=build/goat_elegant/base_platform
# the pinned Lumen APKs of overlay/apps_v1 the image carries: the Play 6 set (tools/play6/sign_play6.py PINNED)
pinned=Z9xHome Z9xTvInput Z9xLineagePlatformOverlay Z9xSetup
# AOSP host tools of the base build (apexer, deapexer, ...) and the source tree that holds the module test keys
host_bin_remote=lumen-builder-backup/play6-out/host/linux-x86/bin
module_keys_remote=lineage/packages/modules
# where the key-free APEX repack and verify run on the host
apex_work_remote=hb-out/apex_sign
# everything compose_hb.sh needs from the Mac, signed (image.conf stage_dir)
stage=build/goat_elegant/signed_stage
# the AOSP test keys of the source tree (an APEX container may be signed with one of them, e.g. testkey)
test_keys_remote=lineage/build/make/target/product/security
