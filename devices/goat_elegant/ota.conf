# Lumen OS OTA data of the XGIMI Z9X HB, host side: read by tools/devices/ota/ota_conf.py (format and keys in its
# header) and by tools/devices/devices.py check-wire (the one wire_id line). Data only, never sourced.
# Design: the design notes; facts: the design notes.
wire_id=hb
# lpdump of the stock super: group_oem_a / group_oem_b, maximum 3460300800 bytes each
super_group=group_oem=3460300800
# vendor/build.prop ro.virtual_ab.compression.enabled=false: legacy (uncompressed) Virtual A/B snapshots
vabc=no
sig_size=512
scanner=devices/goat_elegant/image/check_public_hb.py
manifest_tag=z9x-hb
package_tag=z9x-hb-{version}
repo=Project-Lumen-OS/lumen-os
# design decision (2026-11-04): mboot_a == mboot_b in the dump, so no mboot; vbmeta is never written by an update
ab_ota_partitions=armfw boot bootdata dtbo optee tvconfig tvservice vbmeta_system xgimiconfig
stage_channel=hb-test
